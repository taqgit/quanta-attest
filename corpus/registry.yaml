# Quanta Attest corpus registry
#
# The repository holds this list of links, never the documents themselves.
# `python -m quanta_attest.ingest` downloads each document from its official
# source into data/raw/ (git-ignored) and records what it fetched.
#
# url_status:
#   verified - URL seen on the publisher's site on 2026-10-29
#   confirm  - open the publisher's index page, find the document, paste the
#              direct URL here, then set url_status to verified
#
# Ingest never edits this file. What it actually fetched (date, SHA-256,
# size, chunk count) is recorded in data/manifest.json.

profiles:
  public-sector: Public sector (Ontario and Canada)
  cross-industry: Cross-industry
  regulated: Regulated industry

documents:
